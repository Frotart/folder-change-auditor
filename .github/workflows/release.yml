name: Release

# Publishes a GitHub Release with the built package and SHA256SUMS.txt.
# Start it either by pushing a version tag such as v0.1.0, or manually from the
# Actions tab ("Run workflow" on main), which tags the current commit as
# v<__version__> and releases it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Work out the release tag
        run: |
          version=$(python -c "import folder_auditor; print(folder_auditor.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            test "v$version" = "$tag" || { echo "Tag $tag does not match version $version"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = "main" || { echo "Manual releases run from main only"; exit 1; }
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists; bump __version__ before releasing again"; exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Run tests before releasing
        run: python -m unittest test_folder_auditor
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Write checksums
        run: |
          cp folder_auditor.py dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Folder Change Auditor $TAG" \
            --notes-file release-notes.md
